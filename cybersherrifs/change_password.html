<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <title>Change Password</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 20px;
        }

        .header-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: contain;  /* Changed from 'cover' to 'contain' */
            margin-bottom: 20px;
            background-color: #f0f0f0; /* Added background color for better fit */
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            text-align: left;
        }

        input[type="password"] {
            width: calc(100% - 12px);
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button[type="submit"] {
            background-color: #4c96af;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
        }

        button[type="submit"]:hover {
            background-color: #3b7d8e;
            box-shadow: 0 3px 7px rgba(0,0,0,0.3);
        }

        button[type="submit"]:active {
            background-color: #2c5e6b;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6i3ntEYZoC5TD0DDAUM43iIKY0SbKU91ZJA&s" alt="Police Department Logo" class="header-logo">
    <h1>Change Password</h1>

    <form action="change_password.php" method="POST">
        <label>Current Password:</label><br>
        <input type="password" name="current_password" placeholder="Enter current password" required><br><br>

        <label>New Password:</label><br>
        <input type="password" name="new_password" placeholder="Enter new password" required><br><br>

        <label>Confirm New Password:</label><br>
        <input type="password" name="confirm_new_password" placeholder="Please confirm the password" required><br><br>

        <button type="submit">Change Password</button>
    </form>

</body>
</html>
