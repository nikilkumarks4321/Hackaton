<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      body {
        font-family: sans-serif;
        background-color: #f4f4f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .header-logo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: contain;
        margin-bottom: 20px;
        background-color: #f0f0f0;
    }

    .container {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        width: 80%;
        max-width: 400px;
        text-align: center;
    }

    h1 {
        color: #333;
        margin-bottom: 20px;
    }

    form {
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    input[type="email"],
    input[type="password"] {
        width: calc(100% - 12px);
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 16px;
    }

    button[type="submit"] {
        background-color: #4c96af;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        width: 100%;
    }

    button[type="submit"]:hover {
        background-color: #3b7d8e;
        box-shadow: 0 3px 7px rgba(0,0,0,0.3);
    }

    button[type="submit"]:active {
        background-color: #2c5e6b;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }


    p {
        margin-top: 15px;
        font-size: 14px;
        color: #666;
    }

    a {
        color: #4c96af;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    </style>
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6i3ntEYZoC5TD0DDAUM43iIKY0SbKU91ZJA&s" alt="Police Department Logo" class="header-logo">
    <div class="container">
        <h1>Login</h1>
        <form action="login.php" method="POST">
            <label>Email*:</label>
            <input type="email" name="login_email" placeholder="Enter Email ID" required>
            <label>Password*:</label>
            <input type="password" name="login_password" placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="register.html">Register Here</a></p>
        <p>Forgot password ? <a href="forgot_password.html">Click Here</a></p>
    </div>

    <script>
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', (event) => {
            event.preventDefault(); 
            
            const email = loginForm.login_email.value;
            const password = loginForm.login_password.value;

            
            if (email && password) {
                
                window.location.href = 'index.html'; 
            } else {
                alert('Please enter both email and password.');
            }
        });
    </script>
</body>
</html>
