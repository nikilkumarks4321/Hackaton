<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case Allocation</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8dadc, #457b9d);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 700px;
            text-align: center;
            margin-top: 20px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        h2 {
            color: #1d3557;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #1d3557;
            font-size: 1.1em;
        }

        label span {
            color: #e63946;
        }

        input[type="text"],
        select {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 25px;
            border: 2px solid #457b9d;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #1d3557;
            outline: none;
            box-shadow: 0 0 5px rgba(30, 64, 107, 0.5);
        }

        .submit-button {
            background-color: #1d3557;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .submit-button:hover {
            background-color: #457b9d;
            transform: scale(1.02);
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .header-logo {
            width: 100px;
            height: auto;
            display: block;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 30px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }

            h2 {
                font-size: 2em;
            }

            label {
                font-size: 1em;
            }

            input[type="text"],
            select {
                font-size: 0.9em;
            }

            .submit-button {
                font-size: 1em;
            }

            .header-logo {
                width: 80px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6i3ntEYZoC5TD0DDAUM43iIKY0SbKU91ZJA&s" alt="Police Department Logo" class="header-logo">

        <h2>Case Allocation Form</h2>
        <form id="caseForm" action="thankyou.html" method="POST">
            <label for="officer_id">Officer ID <span>*</span>:</label>
            <input type="text" id="officer_id" name="officer_id" placeholder="Enter officer ID" required><br><br>

            <label for="officer_name">Officer Name <span>*</span>:</label>
            <input type="text" id="officer_name" name="officer_name" placeholder="Enter officer name" required><br><br>

            <label for="station_id">Station ID <span>*</span>:</label>
            <input type="text" id="station_id" name="station_id" placeholder="Enter station ID" required><br><br>

            <label for="fir_id">FIR ID <span>*</span>:</label>
            <input type="text" id="fir_id" name="fir_id" placeholder="Enter FIR ID" required><br><br>

            <label for="case_status">Case Status <span>*</span>:</label><br>
            <select id="case_status" name="case_status" required>
                <option value="">Select Case Status</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
                <option value="investigating">Under Investigation</option>
                <option value="solved">Solved</option>
                <option value="pending_trial">Pending Trial</option>
            </select><br><br>

            <button type="submit" class="submit-button">Allocate Case</button>
        </form>
    </div>
</body>
</html>
